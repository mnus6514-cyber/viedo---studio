<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Video Studio</title>
<style>
:root{--bg:#0f1624;--card:#18223a;--line:#2b3a5c;--txt:#e8eefc;--mute:#93a3c4;--acc:#38bdf8;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,sans-serif;padding:16px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 4px}
input,select,textarea{width:100%;background:#0f1a30;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
textarea{min-height:72px;resize:vertical}
button{background:var(--acc);color:#04202e;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
button.sec{background:#2b3a5c;color:var(--txt)}
button.small{width:auto;padding:6px 12px;margin:0;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{margin:0;background:#2b3a5c;color:var(--txt)}
.tabs button.on{background:var(--acc);color:#04202e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.msg{padding:10px;border-radius:8px;font-size:13px;margin-top:10px;display:none}
.msg.bad{display:block;background:#7f1d1d;color:#fff}
.msg.ok{display:block;background:#14532d;color:#fff}
.hide{display:none}
.job{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:#0f1a30}
.job .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.job .p{font-size:13px;color:var(--mute);margin:4px 0;word-break:break-word}
.bar{height:6px;background:#2b3a5c;border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#2b3a5c}
.tag.done{background:var(--ok);color:#04200f}.tag.error,.tag.cancelled{background:var(--bad)}
video{width:100%;border-radius:8px;margin-top:6px;background:#000}
a.dl{color:var(--acc);font-size:13px}
.note{font-size:12px;color:var(--mute);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<h1>🎬 My AI Video Studio</h1>

<div class="card">
  <label>Backend URL</label>
  <input id="url" placeholder="https://xxxx.ngrok-free.dev" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="connect">Save &amp; connect</button>
  <div id="status" class="note">Not connected</div>
  <div id="err" class="msg"></div>
</div>

<div class="card">
  <div class="tabs">
    <button data-tab="t2v" class="on">Text → Video</button>
    <button data-tab="i2v">Images → Video</button>
    <button data-tab="long">Long video</button>
  </div>

  <div id="tab-t2v">
    <label>Prompt</label>
    <textarea id="p1">A slow cinematic drone shot over a green valley at sunrise</textarea>
    <button id="go1">Generate clip</button>
  </div>

  <div id="tab-i2v" class="hide">
    <label>Images (one clip per image)</label>
    <input type="file" id="imgs" accept="image/*" multiple>
    <label>Prompt (what should move)</label>
    <textarea id="p2">The scene slowly comes alive with gentle natural motion</textarea>
    <label><input type="checkbox" id="stitch2" style="width:auto"> Join all clips into one video</label>
    <button id="go2">Generate from images</button>
  </div>

  <div id="tab-long" class="hide">
    <label>Scenes (one per line, each line = one clip, clips are chained)</label>
    <textarea id="p3" style="min-height:120px">A slow cinematic drone shot over a green valley at sunrise
The camera glides down toward a calm river in the valley
Birds fly over the river as warm light fills the valley</textarea>
    <label>Start image (optional)</label>
    <input type="file" id="img3" accept="image/*">
    <button id="go3">Generate long video</button>
    <div class="note">Clips are made one after another, then joined automatically. Takes a while.</div>
  </div>
</div>

<div class="card">
  <div class="grid">
    <div><label>Size</label>
      <select id="size">
        <option value="704x480">704×480 landscape</option>
        <option value="480x704">480×704 portrait</option>
        <option value="512x512">512×512 square</option>
        <option value="576x320">576×320 fast</option>
      </select></div>
    <div><label>Seconds per clip</label>
      <select id="secs"><option>2</option><option selected>4</option><option>6</option></select></div>
    <div><label>Steps</label><input id="steps" type="number" value="30" min="10" max="60"></div>
    <div><label>Seed (blank = random)</label><input id="seed" type="number" placeholder="random"></div>
  </div>
  <label>Negative prompt</label>
  <input id="neg" value="worst quality, blurry, distorted, watermark">
</div>

<div class="card">
  <div class="top" style="display:flex;justify-content:space-between;align-items:center">
    <strong>Jobs</strong>
    <button id="refresh" class="sec small">Refresh</button>
  </div>
  <div id="jobs"><div class="note">No jobs yet.</div></div>
</div>
</div>

<script>
const $ = s => document.querySelector(s);
const DEFAULT_URL = "https://buffer-arrange-diminish.ngrok-free.dev";
let base = "", connected = false, timer = null;
const cards = {};          // job id -> DOM card
const blobs = {};          // job id -> blob url
const pendingStitch = [];  // [{ids:[...], w, h}]

function clean(u){
  u = (u||"").trim().replace(/\/+$/,"");
  if(u && !/^https?:\/\//i.test(u)) u = "https://" + u;
  return u;
}
function api(path, opts = {}){
  opts.headers = Object.assign({"ngrok-skip-browser-warning":"true"}, opts.headers || {});
  return fetch(base + path, opts);
}
function showErr(t){ const e=$("#err"); e.className="msg bad"; e.textContent=t; }
function showOk(t){ const e=$("#err"); e.className="msg ok"; e.textContent=t; }
function clearMsg(){ $("#err").className="msg"; }

async function connect(){
  clearMsg();
  base = clean($("#url").value);
  $("#url").value = base;
  if(!base){ showErr("Backend URL ထည့်ပါ"); return; }
  localStorage.setItem("backend", base);
  $("#status").textContent = "Connecting...";
  try{
    const r = await api("/api/health");
    if(!r.ok) throw new Error("HTTP " + r.status);
    const h = await r.json();
    connected = true;
    $("#status").textContent = "Connected ✓  GPU: " + h.gpu + (h.vram_free_gb ? "  (" + h.vram_free_gb + " GB free)" : "");
    if(h.gpu.startsWith("NONE")) showErr("GPU မရှိပါ။ Colab: Runtime → Change runtime type → T4 GPU ပြီး ပြန် run ပါ");
    startPolling();
  }catch(e){
    connected = false;
    $("#status").textContent = "Not connected";
    showErr("Backend ချိတ်မရပါ။ Colab tab ပွင့်နေသလား၊ cell run နေသလား၊ URL မှန်သလား စစ်ပါ။ (" + e.message + ")");
  }
}

function params(){
  const [w,h] = $("#size").value.split("x").map(Number);
  return {w, h, secs:+$("#secs").value, steps:+$("#steps").value || 30,
          seed:$("#seed").value === "" ? -1 : +$("#seed").value, neg:$("#neg").value};
}
async function submit({mode, prompt, prev, image}){
  const p = params();
  const fd = new FormData();
  fd.append("mode", mode);
  fd.append("prompt", prompt);
  fd.append("negative", p.neg);
  fd.append("width", p.w);
  fd.append("height", p.h);
  fd.append("frames", p.secs * 24 + 1);
  fd.append("fps", 24);
  fd.append("steps", p.steps);
  fd.append("seed", p.seed);
  if(prev) fd.append("prev", prev);
  if(image) fd.append("image", image);
  const r = await api("/api/jobs", {method:"POST", body:fd});
  if(!r.ok){
    let d = ""; try{ d = (await r.json()).detail; }catch(_){}
    throw new Error(d || ("HTTP " + r.status));
  }
  return r.json();
}
function needConn(){
  if(!connected){ showErr("အရင် Save & connect နှိပ်ပါ"); return false; }
  clearMsg(); return true;
}
async function busy(btn, fn){
  btn.disabled = true;
  try{ await fn(); }catch(e){ showErr(e.message); }
  btn.disabled = false;
  poll();
}

$("#go1").onclick = e => busy(e.target, async () => {
  if(!needConn()) return;
  const t = $("#p1").value.trim(); if(!t) throw new Error("Prompt ရေးပါ");
  await submit({mode:"t2v", prompt:t});
  showOk("Queue ထဲ ထည့်ပြီးပါပြီ");
});

$("#go2").onclick = e => busy(e.target, async () => {
  if(!needConn()) return;
  const files = [...$("#imgs").files]; if(!files.length) throw new Error("ပုံ ရွေးပါ");
  const t = $("#p2").value.trim() || "gentle natural motion";
  const ids = [];
  for(const f of files){ ids.push((await submit({mode:"i2v", prompt:t, image:f})).id); }
  if($("#stitch2").checked && ids.length > 1){
    const p = params(); pendingStitch.push({ids, w:p.w, h:p.h});
  }
  showOk(files.length + " clip queue ထဲ ထည့်ပြီးပါပြီ");
});

$("#go3").onclick = e => busy(e.target, async () => {
  if(!needConn()) return;
  const lines = $("#p3").value.split("\n").map(s => s.trim()).filter(Boolean);
  if(!lines.length) throw new Error("Scene တစ်ကြောင်းအနည်းဆုံး ရေးပါ");
  const start = $("#img3").files[0] || null;
  const ids = []; let prev = null;
  for(let i = 0; i < lines.length; i++){
    let j;
    if(i === 0) j = await submit(start ? {mode:"i2v", prompt:lines[i], image:start} : {mode:"t2v", prompt:lines[i]});
    else j = await submit({mode:"i2v", prompt:lines[i], prev});
    prev = j.id; ids.push(j.id);
  }
  const p = params(); pendingStitch.push({ids, w:p.w, h:p.h});
  showOk(lines.length + " clip queue ထဲ ထည့်ပြီးပါပြီ၊ ပြီးရင် အလိုအလျောက် ပေါင်းပါမယ်");
});

// ---- tabs ----
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["t2v","i2v","long"].forEach(t => $("#tab-" + t).classList.toggle("hide", t !== b.dataset.tab));
});

// ---- jobs list ----
function card(j){
  const d = document.createElement("div");
  d.className = "job";
  d.innerHTML = '<div class="top"><span class="tag"></span><button class="sec small cx">Cancel</button></div>' +
    '<div class="p"></div><div class="bar"><i></i></div><div class="err p"></div><div class="media"></div>';
  d.querySelector(".cx").onclick = async () => { await api("/api/jobs/" + j.id + "/cancel", {method:"POST"}); poll(); };
  return d;
}
async function loadVideo(j, d){
  if(blobs[j.id] !== undefined) return;
  blobs[j.id] = null;
  try{
    const r = await api("/api/jobs/" + j.id + "/video");
    if(!r.ok) throw new Error();
    blobs[j.id] = URL.createObjectURL(await r.blob());
    const m = d.querySelector(".media");
    m.innerHTML = '<video controls playsinline></video><a class="dl" download="' + j.id + '.mp4">⬇ Download</a>';
    m.querySelector("video").src = blobs[j.id];
    m.querySelector("a").href = blobs[j.id];
  }catch(_){ delete blobs[j.id]; }
}
function render(list){
  const box = $("#jobs");
  if(!list.length){ box.innerHTML = '<div class="note">No jobs yet.</div>'; return; }
  if(box.querySelector(".note")) box.innerHTML = "";
  list.forEach(j => {
    let d = cards[j.id];
    if(!d){ d = cards[j.id] = card(j); box.appendChild(d); }
    const tag = d.querySelector(".tag");
    tag.textContent = (j.kind === "stitch" ? "join · " : (j.mode || "") + " · ") + j.status;
    tag.className = "tag " + j.status;
    d.querySelector(".p").textContent = j.kind === "stitch" ? "Joined video" : ((j.params && j.params.prompt) || "");
    d.querySelector(".bar i").style.width = (j.progress || 0) + "%";
    d.querySelector(".err").textContent = j.error || "";
    d.querySelector(".cx").style.display = (j.status === "queued" || j.status === "running") ? "" : "none";
    if(j.status === "done") loadVideo(j, d);
  });
  // newest first
  [...list].reverse().forEach(j => box.prepend(cards[j.id]));
}
async function checkStitch(list){
  const byId = Object.fromEntries(list.map(j => [j.id, j]));
  for(let i = pendingStitch.length - 1; i >= 0; i--){
    const s = pendingStitch[i];
    const st = s.ids.map(id => byId[id] && byId[id].status);
    if(st.some(x => x === "error" || x === "cancelled")){ pendingStitch.splice(i,1); showErr("Clip တစ်ခု မအောင်မြင်လို့ မပေါင်းတော့ပါ"); }
    else if(st.every(x => x === "done")){
      pendingStitch.splice(i,1);
      try{
        const W = s.w > s.h ? 1280 : (s.w < s.h ? 720 : 720);
        const H = s.w > s.h ? 720 : (s.w < s.h ? 1280 : 720);
        await api("/api/stitch", {method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({job_ids:s.ids, width:W, height:H, fps:24})});
      }catch(e){ showErr("Join မအောင်မြင်ပါ: " + e.message); }
    }
  }
}
let polling = false;
async function poll(){
  if(!connected || polling) return;
  polling = true;
  try{
    const r = await api("/api/jobs");
    if(!r.ok) throw new Error("HTTP " + r.status);
    const list = (await r.json()).reverse(); // oldest first
    render(list);
    await checkStitch(list);
  }catch(e){
    connected = false;
    $("#status").textContent = "Disconnected";
    showErr("Backend နဲ့ ဆက်သွယ်မှု ပြတ်သွားပါပြီ။ Colab cell ပြန်စစ်ပြီး Save & connect နှိပ်ပါ");
    clearInterval(timer); timer = null;
  }
  polling = false;
}
function startPolling(){ if(timer) clearInterval(timer); poll(); timer = setInterval(poll, 3000); }

$("#connect").onclick = connect;
$("#refresh").onclick = poll;
$("#url").value = localStorage.getItem("backend") || DEFAULT_URL;
connect();
</script>
</body>
</html>
